<style>
  :root{--ink:#1B2320;--paper:#F5F6F0;--paper-deep:#ECEEE4;--rule:#D8D9CC;--rust:#A63D40;--muted:#5B6259;--max:740px;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;}

  .crumb a:hover{color:var(--rust);border-color:var(--rust);}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 10px;}
  .org{font-style:italic;color:var(--muted);font-size:16px;margin-bottom:28px;}
  .body-copy{max-width:62ch;font-size:16.5px;}
  .body-copy ul{padding-left:18px;}
  .body-copy li{margin-bottom:8px;}
  .body-copy li::marker{color:var(--rust);}
  .placeholder{border-left:2px solid var(--rust);background:var(--paper-deep);padding:16px 20px;margin-top:26px;color:var(--muted);font-size:15px;max-width:56ch;}
  footer{border-top:1px solid var(--rule);padding:32px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);}
